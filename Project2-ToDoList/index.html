<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="style.css">
</head>
  <body>
    <div class="container">
      <h1>Your Awesome To Do List!</h1>
      <div class="new-task">
        <input type="text" id="enterTask" placeholder="Enter Your Task Here">
        <input type="submit" id="addTask" value="Add">
      </div>
      <div class="list-tasks">
      <ul id="listOfTasks"></ul>
    </div>
  </div>
    <script src="script.js"></script>
  </body>
</html>
